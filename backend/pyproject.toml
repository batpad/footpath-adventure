[project]
name = "footpath-adventure-backend"
version = "0.1.0"
description = "Django + PostGIS backend: OSM ingest, route levels, condition reports"
requires-python = "==3.12.*"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "osmium>=4.0",
    "networkx>=3.3",
    "pillow>=12.3.0",
    "gunicorn>=26.0.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.9"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
